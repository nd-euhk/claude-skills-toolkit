openapi: "3.0.3"
info:
  title: Auth Service API
  version: "1.0.0"
  description: User authentication API - registration, login, verification, password reset
servers:
  - url: /api/v1
    description: API Gateway (v1)
paths:
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a new user
      tags: [Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirmation]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                password_confirmation:
                  type: string
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            format: uuid
          required: false
      responses:
        "201":
          description: User registered, verification email sent
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/DuplicateEmail"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful, session created
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AccountUnverified"
        "423":
          $ref: "#/components/responses/AccountLocked"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      operationId: logoutUser
      summary: Terminate current session
      tags: [Authentication]
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Session terminated
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/session:
    get:
      operationId: getSession
      summary: Get current session info
      tags: [Session]
      security:
        - sessionAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify email with token
      tags: [Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification_token]
              properties:
                verification_token:
                  type: string
      responses:
        "200":
          description: Email verified
        "400":
          $ref: "#/components/responses/InvalidToken"
        "409":
          $ref: "#/components/responses/AlreadyVerified"

  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request password reset email
      tags: [Password Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset email sent (if account exists)
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      operationId: executePasswordReset
      summary: Execute password reset with token
      tags: [Password Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, new_password, new_password_confirmation]
              properties:
                reset_token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                  maxLength: 128
                new_password_confirmation:
                  type: string
      responses:
        "200":
          description: Password reset successful
        "400":
          $ref: "#/components/responses/InvalidToken"
        "409":
          $ref: "#/components/responses/SamePassword"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend verification email
      tags: [Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Verification email sent (if account exists and unverified)

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: auth_session
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
            request_id:
              type: string
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            status:
              type: string
    SessionInfo:
      type: object
      properties:
        data:
          type: object
          properties:
            user_id:
              type: string
            email:
              type: string
            created_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time

  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: VALIDATION_ERROR
              message: "Invalid input"
              request_id: "req-abc"
    DuplicateEmail:
      description: Email already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: Invalid email or password
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountUnverified:
      description: Email not verified
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccountLocked:
      description: Account temporarily locked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidToken:
      description: Token invalid or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AlreadyVerified:
      description: Email already verified
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SamePassword:
      description: New password matches current
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
